    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email & Notification Management</title>

    -->

      Angular replaces this element with the rendered AppComponent.
      The selector 'app-root' matches the selector in app.component.ts.
    -->

  </body>
